spring:
  application:
    name: devfacil-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devfacil}
    username: ${SPRING_DATASOURCE_USERNAME:devfacil}
    password: ${SPRING_DATASOURCE_PASSWORD:devfacil}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: devfacil
    password: devfacil
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

devfacil:
  auth:
    secret: ${DEVFACIL_AUTH_SECRET:devfacil-local-secret-change-me}
    admin-key: ${DEVFACIL_ADMIN_KEY:devfacil-admin}
    admin-name: ${DEVFACIL_ADMIN_NAME:Admin DevFacil}
    admin-email: ${DEVFACIL_ADMIN_EMAIL:}
    admin-password: ${DEVFACIL_ADMIN_PASSWORD:}
